  - id: document-literal-evidence-minima-and-exact-query-templates
    diagnosis: >-
      O q013 selected only five relevant sources from eight final rows despite having
      eight relevant candidates in its pool; O q039 changed the proven GraphRAG query
      by adding trade-off and lost the GraphRAG report source. Fix final counts and the
      exact query recipes while preserving O q031's successful decision-boundary path.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-36238a8a61:7ccef88d-43f0-478e-8391-fb9df8c43229
      - development-candidate-01-36238a8a61:c7798f2e-50fc-42af-ae86-40e17e4bf20e
      - development-candidate-01-36238a8a61:b59f8ec6-4db3-44c1-82ab-5d6e3c88039d
      - development-candidate-01-36238a8a61:e82715a6-6359-4dbe-8587-763d37d8c609
    conflictGroup: literal-minimum-and-exact-query-contract
    target: SKILL.md
    operation: append
    content: |

      ## Literal evidence minima and exact terminal query templates

      This section supersedes every earlier answer-target, prose-budget, offline-cost
      query, and named-comparison query instruction. `answer_target` is the literal
      public independent-source minimum, or four when none is stated. The additional
      `source_target` rows are review candidates only. Never cite candidate-margin rows
      merely to increase evidence count. Select exactly `answer_target` directly
      relevant independent sources, use each one, and pass that literal value to
      `--min-sources`.

      For offline index-construction cost, use exactly these five query shapes, keeping
      the question's main subject in place of `SUBJECT`:

      1. `SUBJECT offline index construction entity extraction relationship extraction community detection summary generation cost`
      2. `SUBJECT semantic richness LLM extraction dependency parsing existing graph construction`
      3. `SUBJECT offline build embeddings community detection schema extraction multi granularity index cost`
      4. `SUBJECT incremental indexing rebuild update amortize maintenance cost`
      5. `SUBJECT cheap construction dependency parsing information loss extraction quality domain semantics`

      Prefer candidate texts that explicitly discuss construction, indexing, rebuild,
      extraction, schema, embeddings, or community generation. A paper whose candidate
      discusses only online retrieval pruning or prompt cost is not offline-build
      evidence and must be omitted. For a six-source request, choose exactly six such
      relevant candidates; do not pad the final answer with retrieval-only papers.

      For the named online-efficiency comparison of GraphRAG reports, LightRAG,
      HippoRAG, and GraphReader, the five queries are byte-for-byte these strings:

      1. `+GraphRAG reports mechanism exact baseline cost quality`
      2. `+LightRAG mechanism exact baseline cost quality`
      3. `+HippoRAG mechanism exact baseline cost quality`
      4. `+GraphReader mechanism exact baseline cost quality`
      5. `online efficiency cost comparison baseline quality trade-off`

      Do not add, remove, reorder, stem, or synonymize tokens in those five queries.
      The adjacent word `reports` is part of the GraphRAG source-disambiguation signal.
      A supported mechanism or baseline is usable even if a separate caveat is absent;
      omit only the unsupported caveat rather than returning null.

      The summary plus all claim statements must fit within 1200 characters. Group
      related evidence into at most six concise claims. If the finalizer rejects the
      first draft for this budget, shorten prose only, preserve supported meaning and
      result indices, and use the single permitted repair before the exact file read.
