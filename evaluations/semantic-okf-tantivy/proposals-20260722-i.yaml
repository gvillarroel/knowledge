  - id: enforce-one-row-per-source
    diagnosis: >-
      q001 emitted eleven rows for eight sources, q013 emitted twelve for six, and q031
      emitted five for four; each otherwise structured answer contained exactly one
      invalid copied identity. Multiple pack passages are useful for comparing claims,
      but the final contract should contain exactly one strongest row per required paper
      so the deterministic finalizer bounds the handoff surface.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-9fe9d7afde:30ec5b61-dd07-40a5-9ffe-81e71c278237
      - development-candidate-01-9fe9d7afde:268e3eaf-2bd3-4d4e-a3d9-482f72d19ec9
