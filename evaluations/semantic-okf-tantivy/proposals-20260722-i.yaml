  - id: aggregate-ranking-by-source
    diagnosis: >-
      q013 selected six independent papers but only four were relevant after the
      multi-passage helper ordered source identities by their single highest-ranked
      passage. q039 also returned null from a method-comparison pack. In both tasks,
      several focused queries can match different claims from the same relevant paper;
      summing document RRF scores and query coverage at the paper level restores the
      source-level relevance signal while preserving round-robin passage selection.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-9fe9d7afde:268e3eaf-2bd3-4d4e-a3d9-482f72d19ec9
      - development-candidate-01-9fe9d7afde:012778b4-df7e-448c-ba62-3ca29e85cb07
    conflictGroup: aggregate-source-ranking
    target: scripts/prepare_tantivy_evidence_pack.py
