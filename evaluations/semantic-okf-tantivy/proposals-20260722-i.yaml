  - id: document-one-row-per-source
    diagnosis: >-
      Three independent discovery tasks produced an oversized final evidence array and
      exactly one invalid copied identity. State that additional round-robin passages
      are review candidates only and that the finalizer's exact one-row-per-paper rule
      is mandatory.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-9fe9d7afde:30ec5b61-dd07-40a5-9ffe-81e71c278237
      - development-candidate-01-9fe9d7afde:268e3eaf-2bd3-4d4e-a3d9-482f72d19ec9
      - development-candidate-01-9fe9d7afde:2753db75-ae87-4d61-8a02-d7160d23e059
    conflictGroup: document-one-row-per-source
    target: SKILL.md
    operation: append
    content: |

      ## Compact final evidence rule

      This rule supersedes any earlier allowance for additional final evidence rows.
      Round-robin passages in the multi-passage pack are review candidates used to choose
      the strongest claim for each paper. The final draft must reference exactly one
      result from each of exactly `ANSWER_TARGET` independent papers, for exactly
      `ANSWER_TARGET` total evidence rows. Reuse those rows across claims. The finalizer
      rejects any extra passage or duplicate-source row before emission.
