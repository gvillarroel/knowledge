  - id: teach-multi-passage-pack
    diagnosis: >-
      q001 showed that a uniform two-source margin is too strict for an eight-paper
      minimum, q013 showed that an eight-paper retrieval pool covers a six-paper answer,
      and q039 showed that one claim per paper omits named comparison dimensions. The
      skill needs separate source, result, and answer targets plus the multi-passage
      helper as the sole normal retrieval path.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-64a672f3e1:3ded4ff8-b95f-46d5-a8ff-2c007ca1f37c
      - development-candidate-01-64a672f3e1:5ec87db8-55b8-412c-bcbb-254bb988670e
      - development-candidate-01-64a672f3e1:4ab8a64b-5354-4766-9f84-45d4f5fdc595
    conflictGroup: multi-passage-pack-guidance
    target: SKILL.md
    operation: append
    content: |

      ## Multi-passage evidence pack workflow

      This section supersedes the preceding bounded cross-document workflow for every
      comparative, taxonomy, multi-paper, or synthesis question. Let `MINIMUM` be the
      public independent-paper minimum. Define:

      - `ANSWER_TARGET = MINIMUM`, or `4` when no minimum is stated.
      - `SOURCE_TARGET = MINIMUM + 1` when `MINIMUM >= 8`; otherwise use
        `MINIMUM + 2`. Cap the margin target at `10`; if `MINIMUM > 10`, use
        `MINIMUM` itself. With no public minimum, use `4`.
      - `MAX_RESULTS = min(16, SOURCE_TARGET + 6)`, but never below
        `SOURCE_TARGET`.

      Install requirements once, run one runtime smoke and one bundle inspection, then
      issue exactly one normal pack call with three to five precise queries covering all
      named mechanisms, costs, quality dimensions, and counterevidence:

      ```bash
      python scripts/prepare_tantivy_evidence_pack.py BUNDLE \
        --query 'first precise aspect' \
        --query 'second precise aspect' \
        --query 'third named mechanism' \
        --query 'cost or operational constraint' \
        --query 'quality trade-off or counterevidence' \
        --top-k-per-query 8 \
        --source-target SOURCE_TARGET --max-results MAX_RESULTS \
        --concept-type 'Paper Semantic Claim' --preview-chars 800 \
        --full-output /tmp/tantivy-evidence-pack.json
      ```

      The helper validates the snapshot once, fuses Tantivy BM25 ranks, selects one claim
      from each source first, then adds further claims from those same papers in
      round-robin order. After a successful pack, do not call the direct query helper,
      grep, read, open, inspect, or list any `/knowledge` path, and do not run another
      search. Only when the helper returns `status: error` because `SOURCE_TARGET` was
      not reached may you run one fallback without the `--concept-type` filter.

      Read the saved pack once. Select claims from exactly `ANSWER_TARGET` independent
      papers. Prefer one row per paper; add at most two additional rows only when a named
      comparison dimension requires another claim from an already selected paper.
      Create `/tmp/answer-draft.json` with exactly `question_id`, `summary`, and `claims`,
      in that order. Each claim has exactly `statement` and `result_indices`; indices
      refer to the saved pack's zero-based `results` array. Do not type evidence
      identities. Finalize with:

      ```bash
      python scripts/finalize_bounded_answer.py BUNDLE \
        /tmp/tantivy-evidence-pack.json /tmp/answer-draft.json \
        --min-sources ANSWER_TARGET
      ```

      Run the finalizer once. Only if it returns `status: error`, repair exactly the
      reported draft error and run it one final time. Its first successful output is
      terminal: return the entire indented JSON document unchanged, with no Markdown
      fence, prefix, suffix, further reasoning, editing, shortening, or reconstruction.
