  - id: document-conditional-selection-and-candidate-only-margin
    diagnosis: >-
      The four k trials separate the stable behavior: q039 passes with required named
      methods, generic q001 and q031 become null under unconditional round-robin, and
      q013's mandatory evidence margin lowers relevance. Document the combined terminal
      rule so the helper owns a wide candidate pool but the final answer keeps only the
      literal requirement, using reserved query slots solely for explicit `+terms`.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-41a54e82a1:3890cc02-c78c-4be8-8c49-0c5c13fd9c9f
      - development-candidate-01-41a54e82a1:ce7af499-841c-4ac5-a653-fe2c238717fa
      - development-candidate-01-41a54e82a1:deaf2895-61c6-46a3-a737-2f94fffdeca2
      - development-candidate-01-41a54e82a1:175ab15c-b0d2-4197-9110-ae9e316a01b4
    conflictGroup: terminal-conditional-selection-contract
    target: SKILL.md
    operation: append
    content: |

      ## Conditional source allocation and literal final target

      This section supersedes every earlier statement about final evidence margins and
      query-round-robin allocation. Continue to pass the literal public minimum through
      `--minimum-sources`, using `0` when none is stated. The helper sets
      `answer_target` to that literal minimum, or `4` when none is stated, and exposes a
      larger `source_target` candidate pool. The final draft must use exactly
      `answer_target` relevant independent papers; never cite the candidate margin just
      to fill slots.

      A query receives one reserved source slot only when it contains an explicit
      Tantivy required token beginning with `+`. Use such tokens only for distinctive
      systems or named methods that the question explicitly requires. Generic thematic
      queries must not add artificial `+` terms: their candidates are selected by
      aggregate source RRF, query coverage, and best rank. After the reserved named
      slots, the helper fills the remaining pool from that same aggregate ranking.

      Read all first-pass source candidates before choosing the exact final set. Prefer
      claims that directly answer a named comparison dimension; do not cite a paper
      merely because it discusses a neighboring graph technique. Copy the printed
      `answer_target` unchanged into `--min-sources` when invoking the finalizer. Its
      first successful output remains terminal.
