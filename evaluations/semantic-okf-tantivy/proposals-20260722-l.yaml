  - id: reserve-query-slots-only-for-required-terms
    diagnosis: >-
      q039 passed after named-system queries used Tantivy required terms, while q001
      and q031 returned null and q013 lost relevance when every generic thematic query
      received round-robin source slots. Reserve one source slot for each query that
      contains an explicit `+term`; fill every other slot from aggregate source RRF.
      This preserves method coverage without displacing broadly supported synthesis.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-41a54e82a1:3890cc02-c78c-4be8-8c49-0c5c13fd9c9f
