  - id: document-stable-query-recipes-and-candidate-review
    diagnosis: >-
      m q013 and q031 used stable facet queries and found qualifying evidence, while
      n paraphrased those facets and lost coverage; n q039 also dropped the adjacent
      word reports from the named GraphRAG query and selected a different paper.
      Make query planning literal and deterministic, expose the candidate margin, and
      require concise grouped drafts before the exact terminal read.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-1888edfe3d:8f4c3884-f035-4375-b209-77d916d513b1
      - development-candidate-01-1888edfe3d:08cf26d4-0393-41d3-9ff8-b30944c55407
      - development-candidate-01-1888edfe3d:5563e4cd-2838-4a83-ad89-033201e58921
      - development-candidate-01-1888edfe3d:52d7027b-5217-42d9-9198-ef284edb4d1d
    conflictGroup: stable-query-and-compact-terminal-contract
    target: SKILL.md
    operation: append
    content: |

      ## Stable query recipes and candidate review

      This section supersedes every earlier query-planning, candidate-selection, and
      draft-length instruction. Query wording is part of the retrieval contract. Use
      nouns and adjacent qualifiers verbatim from the question; do not replace them
      with imaginative synonyms. Use exactly five queries when five distinct facets
      are available. Each query should cover one facet and may repeat the main subject
      so source-level fusion rewards papers that cover several facets.

      For an offline construction-cost question, use these stable facets in order:

      1. subject plus entity extraction, relationship extraction, community detection,
         summarization, and cost;
      2. subject plus graph construction, chunking, entities, relations, and semantic
         richness;
      3. subject plus indexing, embeddings, vector database, and token cost;
      4. subject plus update, incremental, dynamic graph, maintenance, and cost;
      5. subject plus baseline, local/global retrieval, information loss, and
         simplification.

      For a routing or decision-boundary question, use these stable facets in order:

      1. simple factual question, standalone language model, basic retrieval, evidence;
      2. basic RAG, factual question, precise answer, context;
      3. the graph method, interconnected multi-hop synthesis, global/local graph;
      4. graph evidence noise, extraction errors, misleading or incomplete retrieval;
      5. graph retrieval cost, trade-off, simple facts, and the always-use-graph
         counterfactual.

      For a named-method comparison, keep each exact name and every adjacent qualifier
      from the question in its own required-term query. For example, the phrase
      `GraphRAG reports` must become `+GraphRAG reports ...`, not the broader
      `+GraphRAG mechanism ...`. Do not let generic words erase a literal qualifier.

      In generic mode, `source_target` is now a candidate-pool size and may exceed
      `answer_target`. Read all returned candidates once, discard weak or off-topic
      rows, and draft with exactly `answer_target` independent sources. Do not return
      null merely because some candidates are weak when enough directly supported
      rows remain. In decision-boundary answers, it is valid to infer the routing rule
      from explicit task-scope, cost, and failure claims; state the boundary without
      inventing a performance result for the simpler system.

      Before finalization, group related evidence into no more than six claims and keep
      the summary plus all claim statements within 1800 characters. Multiple result
      indices may support one claim, and every chosen evidence row must be used. If the
      finalizer reports the prose budget error, shorten only prose, preserve the same
      supported meaning and indices, and use the one permitted repair. Then write the
      terminal file, read it exactly once, and copy that one line byte-for-byte.
