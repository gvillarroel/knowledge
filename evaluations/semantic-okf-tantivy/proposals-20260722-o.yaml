  - id: define-terminal-semantic-text-budget
    diagnosis: >-
      n q013 emitted a mechanically exact compact response, while n q039 duplicated a
      133-character evidence fragment after reading a valid 3729-byte final file.
      Bound only model-authored summary and claim text so exact evidence identities
      remain untouched while the terminal payload becomes easier to copy faithfully.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-1888edfe3d:08cf26d4-0393-41d3-9ff8-b30944c55407
      - development-candidate-01-1888edfe3d:52d7027b-5217-42d9-9198-ef284edb4d1d
    conflictGroup: terminal-text-budget-constant
    target: scripts/finalize_bounded_answer.py
    operation: replace
    old: |2
      from bounded_workflow import (
          EVIDENCE_KEYS,
          _answer_errors,
          _evidence,
          _lint_documents,
      )
    content: |2
      from bounded_workflow import (
          EVIDENCE_KEYS,
          _answer_errors,
          _evidence,
          _lint_documents,
      )

      MAX_CLAIMS = 6
      MAX_SEMANTIC_TEXT_CHARS = 1800

