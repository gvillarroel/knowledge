  - id: clamp-generic-candidates-without-growing-answer
    diagnosis: >-
      q001 passed after the adaptive clamp reduced an unavailable optional margin to
      eight public sources. Once source_target becomes a candidate-pool target, a
      partial candidate margin must preserve answer_target when enough answer rows
      exist, and reduce it only when the public minimum is the only achievable bound.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-1888edfe3d:8f4c3884-f035-4375-b209-77d916d513b1
      - development-candidate-01-1888edfe3d:08cf26d4-0393-41d3-9ff8-b30944c55407
    conflictGroup: adaptive-candidate-clamp
    target: scripts/prepare_tantivy_evidence_pack.py
