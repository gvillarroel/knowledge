    diagnosis: >-
      n q013 proves the compact response can retain valid evidence, while n q039
      reached a valid deterministic finalizer output before the assistant duplicated
      exact evidence text. Calculate the human-authored text budget after claim
      validation and reject only excessive prose, never evidence identifiers or paths.
    domain: execution-efficiency/context-budget
    evidenceIds:
