  - id: separate-generic-answer-and-candidate-targets
    diagnosis: >-
      q013 had to cite all eight returned rows and only five were relevant, while
      q031 returned null after a four-row pack lacked a complete decision boundary.
      Preserve the qualified answer target but expose four additional independent
      source candidates so the agent can discard weak rows instead of treating every
      retrieved source as mandatory evidence.
