      - development-candidate-01-1888edfe3d:52d7027b-5217-42d9-9198-ef284edb4d1d
    conflictGroup: terminal-text-budget-total
    target: scripts/finalize_bounded_answer.py
    operation: replace
    old: |2
              normalized.append((statement, indices))
          return question_id, summary, normalized
    content: |2
              normalized.append((statement, indices))
          semantic_chars = len(summary) + sum(
              len(statement) for statement, _ in normalized
          )
          if semantic_chars > MAX_SEMANTIC_TEXT_CHARS:
              raise SnapshotError(
                  "draft summary and claim statements exceed "
                  f"{MAX_SEMANTIC_TEXT_CHARS} characters; group evidence "
