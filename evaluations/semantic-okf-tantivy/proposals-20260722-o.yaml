    evidenceIds:
      - development-candidate-01-1888edfe3d:08cf26d4-0393-41d3-9ff8-b30944c55407
      - development-candidate-01-1888edfe3d:5563e4cd-2838-4a83-ad89-033201e58921
    conflictGroup: generic-candidate-margin
    target: scripts/prepare_tantivy_evidence_pack.py
    operation: replace
    old: |2
                      args.answer_target = (
                          public_target
                          if public_target > 10 or args.minimum_sources == 0
                          else min(public_target + 2, 10)
                      )
                      args.source_target = args.answer_target
                      args.max_results = args.answer_target
    content: |2
                      args.answer_target = (
                          public_target
                          if public_target > 10 or args.minimum_sources == 0
                          else min(public_target + 2, 10)
                      )
