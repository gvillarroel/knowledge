      n q013 preserved the response contract and every exact evidence identity, while
      n q039's valid direct-read payload was corrupted during the final assistant
      copy. Require grouped, concise claims before rendering so the deterministic
      finalizer can reject verbose drafts and produce a smaller byte-for-byte payload.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-1888edfe3d:08cf26d4-0393-41d3-9ff8-b30944c55407
      - development-candidate-01-1888edfe3d:52d7027b-5217-42d9-9198-ef284edb4d1d
    conflictGroup: terminal-text-budget-check
    target: scripts/finalize_bounded_answer.py
    operation: replace
    old: |2
          if not isinstance(claims, list) or not claims:
              raise SnapshotError("draft claims must be a nonempty array")
          normalized: list[tuple[str, list[int]]] = []
    content: |2
          if not isinstance(claims, list) or not claims:
              raise SnapshotError("draft claims must be a nonempty array")
          if len(claims) > MAX_CLAIMS:
              raise SnapshotError(
