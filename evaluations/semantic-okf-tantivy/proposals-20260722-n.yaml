  - id: document-adaptive-margin-direct-read-and-partial-caveats
    diagnosis: >-
      q001 failed because an optional generic margin was unavailable despite meeting
      its public minimum; q031 corrupted hashes after finalization; q039 had four
      dedicated named-method sources but returned null because not every caveat was
      equally explicit. Document adaptive margins, direct file handoff, and claim-level
      omission of unsupported caveats without discarding supported comparisons.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-2d0726e289:e8bef1d5-ff0c-437d-b742-f4561f73b3ff
      - development-candidate-01-2d0726e289:1f9b2fa5-1462-4499-87f9-656e82b08205
      - development-candidate-01-2d0726e289:81a62b05-7c0a-4885-b21a-8df48746dcdc
      - development-candidate-01-2d0726e289:9725eda4-3365-449d-bf57-9529e9db1060
    conflictGroup: terminal-adaptive-and-direct-read-contract
    target: SKILL.md
    operation: append
    content: |

      ## Adaptive margins and direct terminal file handoff

      This section supersedes every earlier fallback and terminal-copy instruction.
      In generic synthesis mode, the two-paper margin is desirable but not mandatory.
      If the filtered pack reaches the literal public minimum but not the derived
      margin, the helper reduces `answer_target` to the available source count and
      returns `status: pass`. Do not run the unfiltered fallback after that pass. A
      fallback remains allowed only after an actual `status: error`.

      In named-comparison mode, a supported mechanism or exact baseline remains usable
      even when the same paper does not state a separate quality trade-off. Omit the
      unsupported caveat from that claim; do not discard all supported method evidence
      or return null merely because caveat detail is asymmetric across methods. Every
      statement that remains must still be directly supported by its selected claim.

      Always finalize to a terminal file outside the snapshot:

      ```bash
      python scripts/finalize_bounded_answer.py BUNDLE \
        /tmp/tantivy-evidence-pack.json /tmp/answer-draft.json \
        --min-sources ANSWER_TARGET_FROM_PACK \
        --output /tmp/tantivy-final-answer.json
      ```

      A successful command prints only a `status`, `output`, and `sha256` receipt. The
      next and only tool call must be the agent's exact `read` tool on
      `/tmp/tantivy-final-answer.json`; do not use `cat`, another script, or a shell
      read. After that tool result, return its single complete JSON line byte-for-byte
      as the next assistant response. Do not parse, pretty-print, normalize, or retype
      hashes or paths.
