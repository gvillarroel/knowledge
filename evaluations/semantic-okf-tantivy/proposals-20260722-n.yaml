  - id: clamp-unfilled-generic-margin-to-public-target
    diagnosis: >-
      q001's filtered pack found eight sources against a desired margin of ten, then a
      permitted unfiltered fallback degraded to seven and forced a null answer. q013
      shows that the generic eight-source path passes when the margin exists. If a
      generic query set reaches the public minimum but not the optional margin, clamp
      all derived targets to the available source count and return the valid pack.
    domain: semantic-improvement
    evidenceIds:
      - development-candidate-01-2d0726e289:e8bef1d5-ff0c-437d-b742-f4561f73b3ff
