  - id: write-terminal-file-and-digest-receipt
    diagnosis: >-
      q031 corrupted two hash substrings after receiving a valid compact tool result,
      whereas q013 copied the same format successfully. Write the already validated
      compact JSON to a path outside the read-only bundle and emit only a SHA-256
      receipt; the agent can then use its exact file-read tool for the terminal copy.
    domain: execution-efficiency/context-budget
    evidenceIds:
      - development-candidate-01-2d0726e289:1f9b2fa5-1462-4499-87f9-656e82b08205
      - development-candidate-01-2d0726e289:81a62b05-7c0a-4885-b21a-8df48746dcdc
    conflictGroup: terminal-file-write
    target: scripts/finalize_bounded_answer.py
    operation: replace
    old: |2
              payload = finalize(
                  args.bundle,
                  _load_object(args.pack, str(args.pack)),
                  _load_object(args.draft, str(args.draft)),
                  args.min_sources,
              )
    content: |2
              payload = finalize(
                  args.bundle,
                  _load_object(args.pack, str(args.pack)),
                  _load_object(args.draft, str(args.draft)),
                  args.min_sources,
              )
              rendered = json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":"),
                  allow_nan=False,
              )
              terminal_output = rendered
              if args.output is not None:
                  output = args.output.resolve()
                  bundle = args.bundle.resolve()
                  if output == bundle or bundle in output.parents:
                      raise SnapshotError(
                          "terminal output must be outside the snapshot"
                      )
                  if not output.parent.is_dir():
                      raise SnapshotError(
                          "terminal output parent must already exist"
                      )
                  output.write_text(rendered + "\n", encoding="utf-8")
                  terminal_output = json.dumps(
                      {
                          "status": "pass",
                          "output": str(output),
                          "sha256": hashlib.sha256(
                              rendered.encode("utf-8")
                          ).hexdigest(),
                      },
                      sort_keys=True,
                      separators=(",", ":"),
                  )

